# Run config for `vigil watch`
source: certstream          # certstream | fixtures
certstream_url: ws://127.0.0.1:8080/
fixtures_path: tests/fixtures/certs.jsonl
watchlist: data/watchlist.yml
rules_config: data/rules.yml
skip_wildcards: true
max_domain_length: 40
detection: true
metrics: false
metrics_interval: 2.0
score_threshold: 40
