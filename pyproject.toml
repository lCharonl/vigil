[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vigil"
version = "0.1.0"
description = "Phishing-infrastructure detection engine built on Certificate Transparency logs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "websockets>=12.0",
    "pyyaml>=6.0",
    "typer>=0.12",
    "tldextract>=5",
]

[project.scripts]
vigil = "vigil.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/vigil"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# typer's idiomatic default-argument pattern (`= typer.Option(...)`) trips B008.
"src/vigil/cli.py" = ["B008"]
